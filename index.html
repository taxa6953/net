<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>کارت پستال — چاپ سیاه و سفید</title>
  <style>
    /* تنظیم برای چاپ کارت 10x15 cm */
    @page {
      size: 10cm 15cm;
      margin: 0;
    }
    /* بدنه صفحه برای نمایش در مرورگر */
    html,body{
      height:100%;
      margin:0;
      padding:0;
      background:#fff;
      font-family: "Tahoma", "IRANSans", sans-serif;
      -webkit-print-color-adjust: exact;
    }

    /* کانتینر کارت دقیقا اندازه 10x15 */
    .card {
      width:10cm;
      height:15cm;
      box-sizing:border-box;
      padding:12mm; /* فاصله داخلی */
      border: 1px solid #000; /* حاشیه قابل حذف برای برش */
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background: #fff;
      color:#000;
    }

    /* محتوای بالایی کارت */
    .top {
      text-align:center;
    }
    .title {
      font-size:20px;
      font-weight:700;
      margin-bottom:8px;
    }
    .message {
      font-size:12px;
      line-height:1.5;
      direction:rtl;
    }

    /* محل قرارگیری QR در پایین */
    .bottom {
      display:flex;
      justify-content:center; /* وسط کارت */
      align-items:center;
      gap:8px;
    }

    .qr {
      width:3.2cm;  /* اندازه QR (قابل تغییر) */
      height:3.2cm;
      padding:6px;
      box-sizing:border-box;
      border-radius:6px; /* گوشه‌های ملایم */
      border: 1px solid #000;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .qr img{
      max-width:100%;
      height:auto;
      display:block;
    }

    .qr-label{
      font-size:10px;
      text-align:center;
      margin-top:6px;
    }

    /* برای پیش‌نمایش روی صفحه بزرگتر، وسط صفحه قرار بده */
    .paper {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:#f6f6f6;
    }
  </style>
</head>
<body>
  <div class="paper">
    <div class="card" role="article" aria-label="کارت پستال">
      <div class="top">
        <div class="title">برای تو، با بهترین آرزوها</div>
        <div class="message">
          سلام دوست عزیز!<br>
          امیدوارم همیشه لبخند روی لبت باشه. این کارت یک یادگاری کوچیکه — امیدوارم خوشت بیاد.
        </div>
      </div>

      <!-- فضای خالی یا طراحی میانی (می‌تونی یک خط‌نگاره اینجا بذاری) -->
      <div style="flex:1"></div>

      <div class="bottom">
        <!-- QR: جایگزین YOUR_URL_HERE با URL مورد نظر -->
        <div class="qr" title="اسکن کنید">
          <img
            alt="QR code — اسکن کنید"
            src="https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl=YOUR_URL_HERE&chld=L|1" />
        </div>
      </div>
      <div style="text-align:center; font-size:10px; margin-top:6px;">اسکن کنید — هدیه دیجیتال</div>
    </div>
  </div>
</body>
</html>
